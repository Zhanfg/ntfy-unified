name: G3 Android native arm64 build (unsigned)

on:
  push:
    branches:
      - feature/g3-android-0.0.3
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g3-android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: g3-android-aarch64
      - name: Install Android SDK and NDK for target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          mapfile -t managers < <(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V)
          test "${#managers[@]}" -gt 0
          SDKMANAGER="${managers[${#managers[@]}-1]}"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --licenses < <(yes) >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Verify Android Cargo dependencies are locked
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target aarch64-linux-android
      - name: Initialize Tauri Android project without signing material
        run: pnpm exec tauri android init --ci --skip-targets-install
      - name: Build release Android arm64 libraries and unsigned APK
        run: pnpm exec tauri android build --apk --target aarch64
      - name: Audit unsigned APK artifact and calculate digest
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*unsigned.apk' | sort)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one unsigned release APK, found ${#packages[@]}." >&2
            exit 1
          fi
          apk="${packages[0]}"
          echo "Unsigned APK file: $apk"
          stat -c 'Unsigned APK bytes: %s' "$apk"
          sha256sum "$apk" | tee android-sha256.txt
          echo "UNSIGNED_APK_PATH=$apk" >> "$GITHUB_ENV"
          echo "#### Android G3 unsigned native build" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "File: $apk" >> "$GITHUB_STEP_SUMMARY"
          stat -c 'Bytes: %s' "$apk" >> "$GITHUB_STEP_SUMMARY"
          cat android-sha256.txt >> "$GITHUB_STEP_SUMMARY"
          echo "Not installable or device-verified until secure signing and real-device E2E." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unsigned Android build for controlled signing only
        uses: actions/upload-artifact@v4
        with:
          name: ntfy-unified-0.0.3-android-arm64-unsigned
          path: |
            ${{ env.UNSIGNED_APK_PATH }}
            android-sha256.txt
          if-no-files-found: error
          retention-days: 7
