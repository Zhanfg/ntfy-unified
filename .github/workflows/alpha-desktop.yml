name: Alpha 0.0.1 desktop CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build:ui

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Tauri Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libpipewire-0.3-dev libgbm-dev patchelf xvfb dbus-x11 gnome-keyring libsecret-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tauri build --bundles deb
      - name: Smoke test Linux startup with ephemeral OS keyring
        shell: bash
        run: |
          set -uo pipefail
          test -x src-tauri/target/release/ntfy_unified
          set +e
          timeout --signal=TERM --kill-after=3s 15s \
            xvfb-run -a dbus-run-session -- bash -euo pipefail -c '
              export HOME="$RUNNER_TEMP/ntfy-smoke-home"
              mkdir -p "$HOME"
              chmod 700 "$HOME"
              keyring_password="$(head -c 32 /dev/urandom | base64)"
              eval "$(printf "%s\n" "$keyring_password" | gnome-keyring-daemon --daemonize --login --components=secrets)"
              unset keyring_password
              printf ready | secret-tool store --label=ntfy-smoke-test app ntfy-unified-ci
              test "$(secret-tool lookup app ntfy-unified-ci)" = ready
              exec env GDK_BACKEND=x11 WEBKIT_DISABLE_DMABUF_RENDERER=1 \
                       WEBKIT_DISABLE_COMPOSITING_MODE=1 RUST_BACKTRACE=1 \
                       ./src-tauri/target/release/ntfy_unified
            ' > smoke.log 2>&1
          status=$?
          set -e
          tail -n 80 smoke.log || true
          if [ "$status" -ne 124 ]; then
            echo "Unexpected Linux smoke process exit code: $status" >&2
            exit 1
          fi
          echo "Native process remained running for 15 seconds with encrypted key storage."
      - name: Record actual Linux package size
        shell: bash
        run: |
          set -euo pipefail
          file=src-tauri/target/release/bundle/deb/ntfy-unified_0.0.1_amd64.deb
          test -s "$file"
          size=$(stat -c '%s' "$file")
          echo "Linux DEB bytes: $size"
          echo "Linux DEB MiB: $(awk -v s="$size" 'BEGIN {printf "%.2f", s / 1048576}')"
      - uses: actions/upload-artifact@v4
        with:
          name: ntfy-unified-alpha-0.0.1-linux
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: windows-2025
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: ntfy-unified-alpha-0.0.1-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
